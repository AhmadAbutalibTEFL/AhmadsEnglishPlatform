<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="BookMyClass connects students and parents with independent teachers to schedule one-off and weekly recurring lessons online.">
<title>BookMyClass — Online Lesson Booking & Scheduling</title>
<style>
:root{--bg:#f3f5ff;--card:#fff;--ink:#1d2340;--mut:#6b7194;--pri:#5b5bf0;--acc:#2fc4b2;--line:#e1e5f6;--danger:#b00020;--danger-bg:#ffe9e9}
@media(prefers-color-scheme:dark){:root{--bg:#12142a;--card:#1c1f3d;--ink:#eef0ff;--mut:#9aa0c8;--line:#2d315a;--danger:#ff8a9a;--danger-bg:#3b1822}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
.hero{background:linear-gradient(135deg,#5b5bf0,#2fc4b2);color:#fff;padding:20px 18px 54px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;max-width:760px;margin:0 auto 16px}
.brand-link{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:19px;letter-spacing:.2px;cursor:pointer}
.brand-icon{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.22);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
.bar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.bar button:hover{background:rgba(255,255,255,.32)}
.hero h1{max-width:760px;margin:0 auto;font-size:26px}
.hero p{max-width:760px;margin:6px auto 0;opacity:.92;line-height:1.5}
main{max-width:760px;width:100%;margin:-34px auto 32px;padding:0 14px;flex:1}
main.wide{max-width:1120px}
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(60,60,140,.1)}
.card h2{margin:0 0 12px;font-size:17px;display:flex;gap:8px;align-items:center}
.card h3{margin:0 0 8px;font-size:15px}
.n{background:var(--pri);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
select,input,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:var(--card);color:var(--ink);margin-bottom:10px;font-family:inherit}
input[type=checkbox]{width:auto;margin:0}
input.t{width:auto;margin:0;padding:8px}
textarea{min-height:80px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.danger{color:var(--danger);border-color:var(--line)}
.chip small{display:block;opacity:.75}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;color:#fff;background:var(--pri);cursor:pointer;font-family:inherit}
.btn.g{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.d{background:var(--danger-bg);color:var(--danger);border:1.5px solid var(--danger)}
.btn.w{background:#25d366;display:block;text-align:center;text-decoration:none;margin-top:10px}
a.btn{display:block;text-align:center;text-decoration:none;margin-top:10px}
.mut{color:var(--mut);font-size:14px;line-height:1.5}
.err{background:var(--danger-bg);color:var(--danger);padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:14px}
.okb{background:#e3f8ef;color:#0b6b47;padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:14px}
.ok{text-align:center}.ok .big{font-size:44px}
.bk{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.bk:first-of-type{border-top:0;padding-top:0}
.bk a{color:var(--pri);font-size:14px}
.tc{display:flex;gap:14px;align-items:center}
.tc h2{margin:0 0 4px;font-size:19px}.tc p{margin:0}
.av{flex:none;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#5b5bf0,#2fc4b2);color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.fl{font-size:13px;color:var(--mut);margin:0 0 4px;display:block}
.day{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.day:first-of-type{border-top:0}
.day b{width:90px;flex:none;padding-top:8px}
.day .rs{display:flex;flex-direction:column;gap:8px;flex:1}
.lk{display:flex;gap:8px;align-items:stretch}.lk input{margin:0;direction:ltr}
.ck{display:flex;gap:8px;padding:6px 0;font-size:15px;align-items:center}
.ck a{color:var(--pri);cursor:pointer;text-decoration:underline}
.sub{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.feat{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.feat b{display:block;margin-bottom:4px;font-size:15px}
.calwrap{overflow-x:auto;padding-bottom:8px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(148px,1fr));gap:8px;min-width:1040px}
.timetable-wrap{overflow:auto;margin-top:12px}.timetable{display:grid;grid-template-columns:72px repeat(7,minmax(112px,1fr));min-width:930px;border-top:1px solid var(--line);border-left:1px solid var(--line);gap:0}.tt-head,.tt-time,.tt-cell{min-height:42px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px}.tt-head{position:sticky;top:0;background:var(--card);font-weight:700;text-align:center;z-index:1}.tt-time{background:var(--bg);font-variant-numeric:tabular-nums;color:var(--muted);text-align:center}.tt-cell{background:var(--bg)}.tt-free{background:#eaf7ee}.tt-free button{border:0;border-radius:8px;background:#c9ebd3;color:#14532d;font-weight:800;width:28px;height:26px;cursor:pointer}.tt-booked{background:#eee9fb;color:#49317e}.tt-booked small{display:block;font-size:10px}.tt-occupied{background:#f2eff9}.tt-closed{background:var(--bg);opacity:.5}.tt-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.calday{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:220px}
.calday.single{min-height:auto}
.calday h3{font-size:14px;margin:0 0 8px}
.calfree{font-size:12px;color:#087b5b;background:#dff7ed;border-radius:8px;padding:8px;margin:6px 0}
.calbook{font-size:12px;background:#e7e8ff;border-inline-start:4px solid var(--pri);border-radius:8px;padding:8px;margin:6px 0;color:#1d2340}
.calbook small{display:block;color:#4a5072;margin-top:3px}
.calempty{font-size:12px;color:var(--mut);padding:8px 0}
.calnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(91,91,240,.14);color:var(--pri);margin-inline-start:6px}
.modal-bg{position:fixed;inset:0;background:rgba(15,18,38,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:var(--card);color:var(--ink);border-radius:18px;max-width:440px;width:100%;padding:20px;box-shadow:0 12px 36px rgba(0,0,0,.28)}
.modal h3{margin:0 0 8px;font-size:18px}
.modal .stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}
footer.site-footer{max-width:760px;width:100%;margin:0 auto 28px;padding:14px 18px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--mut)}
footer.site-footer a{color:var(--pri);text-decoration:none;font-weight:500}
footer.site-footer a:hover{text-decoration:underline}
@media(max-width:640px){.day{flex-direction:column;gap:4px}.day b{width:auto;padding:0}.g2,.g3{grid-template-columns:1fr}}
code{background:var(--bg);padding:2px 8px;border-radius:8px;font-size:15px;direction:ltr;display:inline-block}
</style>
</head>

function toUtc(d,t,tz){const[Y,M,D]=d.split('-').map(Number),[h,m]=t.split(':').map(Number),g=Date.UTC(Y,M-1,D,h,m);return g-off(g-off(g,tz),tz)}

async function loadBook(keep){
  if(!S.user||!S.t) return;
  const id=S.t.id, ty=keep&&S.ty&&S.ty.id, err=keep?S.err:'';
  S.ty=null;S.day=null;S.slot=null;S.slots={};S.done=null;S.err=err;
  const [a,b,c,r] = await Promise.all([
    sb.from('session_types').select('*').eq('teacher_id',id).eq('is_active',true).order('duration_min'),
    sb.from('availability_rules').select('*').eq('teacher_id',id),
    sb.from('availability_exceptions').select('*').eq('teacher_id',id),
    sb.rpc('get_busy_times',{p_teacher:id,p_from:new Date().toISOString(),p_to:new Date(Date.now()+85*864e5).toISOString()})]);
  S.types=a.data||[]; S.rules=b.data||[]; S.exc=c.data||[];
  S.busy=(r.data||[]).map(x=>[Date.parse(x.starts_at),Date.parse(x.blocked_until)]);
  S.ty=(ty&&S.types.find(x=>x.id===ty)) || (S.types.length===1?S.types[0]:null);
  S.loaded=id; build();
}
function build(){
  S.slots={}; S.day=null; S.slot=null; if(!S.t||!S.ty) return;
  const tz=S.t.timezone, dur=S.ty.duration_min*6e4, buf=S.ty.buffer_min*6e4;
  const isTeacherOverride = S.rsAsTeacher && S.me?.teacher?.id === S.t.id;
  const min=Date.now()+(isTeacherOverride || S.t.on_the_spot_booking ? 0 : 8)*36e5;
  const td=new Date().toLocaleDateString('en-CA',{timeZone:tz}).split('-').map(Number);
  const horizonDays = S.rs ? 28 : 14;
  for(let i=0;i<horizonDays;i++){
    const dt=new Date(Date.UTC(td[0],td[1]-1,td[2]+i)), ds=dt.toISOString().slice(0,10), ex=S.exc.filter(x=>x.on_date===ds);
    const w = ex.some(x=>!x.is_available) ? [] : ex.length ? ex.filter(x=>x.is_available) : S.rules.filter(r=>r.weekday===dt.getUTCDay());
    w.forEach(r=>{
      const a=toUtc(ds,r.start_time.slice(0,5),tz), b=toUtc(ds,r.end_time.slice(0,5),tz);
      for(let s=a;s+dur<=b;s+=18e5){
        if(s<min||S.busy.some(([x,y])=>s<y&&s+dur+buf>x)) continue;
        const k=new Date(s).toLocaleDateString('en-CA'); const arr=(S.slots[k]=S.slots[k]||[]); if(!arr.includes(s)) arr.push(s);
      }
    });
  }
  Object.values(S.slots).forEach(a=>a.sort((x,y)=>x-y));
}

async function book(){
  if(S.booking) return;
  const n=$('#sn').value.trim(); if(!n){S.err=tr('needName');render();return}
  const ph=$('#ph').value.trim();
  const isRec=!!$('#recurringBooking')?.checked;
  S.booking=true;
  const submit=$('#app .card:last-child .btn');
  if(submit){submit.disabled=true;submit.textContent=lang==='ar'?'جارٍ تأكيد الحجز…':'Booking…';}
  try{
    const {data,error}=await sb.rpc('book_slot',{p_teacher:S.t.id,p_session_type:S.ty.id,p_starts:new Date(S.slot).toISOString(),p_student:n,p_phone:ph,p_notes:'',p_recurring:isRec});
    if(error){
      const em=(error.message||'').toLowerCase(), lim=em.includes('booking limit'), soon=em.includes('too soon');
      S.booking=false; S.err=''; await loadBook(true); S.err=tr(lim?'limit':soon?'tooSoon':'taken'); render(); return;
    }
    const createdForTeacher=!!S.teacherBooking;
    S.err=''; S.booking=false;
    if(createdForTeacher){
      S.teacherBooking=false; S.rsAsTeacher=false; S.slug=null; S.done=null;
      await loadDash(); S.tab='calendar'; S.msg=lang==='ar'?'تم حجز الحصة للطالب بنجاح.':'Lesson booked for the student.'; render(); return;
    }
    S.done={start:S.slot,name:n,type:S.ty,t:S.t,meeting:'',whatsapp:'',recurring:isRec}; render();
    try{
      const ct=await contactFor(data);
      S.done.meeting=ct.meeting_url||''; S.done.whatsapp=ct.whatsapp||'';
      await loadMine();
      if(S.me?.teacher) await loadDash();
    }catch(refreshError){ console.warn('Booking succeeded; optional post-booking refresh failed:',refreshError); }
    render();
  }catch(requestError){
    console.error('Booking request failed:',requestError);
    S.booking=false; S.err=tr('taken'); render();
  }
}

async function saveHours(){

    for(let i=0;i<a.length;i++){

function renderDayCol(day, tz, fmtTime, fmt24, dayKey, minBookAt, isSingle){
  const wd=new Date(day.key+'T12:00:00Z').getUTCDay(), ex=S.dExc.filter(x=>x.on_date===day.key);
  const windows=ex.some(x=>!x.is_available)?[]:ex.length?ex.filter(x=>x.is_available).map(x=>[(x.start_time||'').slice(0,5),(x.end_time||'').slice(0,5)]):S.wk[wd]||[];
  const bookings=S.dBk.filter(b=>dayKey(new Date(b.starts_at))===day.key).sort((a,b)=>Date.parse(a.starts_at)-Date.parse(b.starts_at));
  let h='<div class="calday'+(isSingle?' single':'')+'"><h3>'+day.date.toLocaleDateString(loc(),{timeZone:tz,weekday:isSingle?'long':'short',day:'numeric',month:'short'})+'</h3>';
  if(windows.length){
    const free=[]; const types=S.dTypes.filter(x=>x.is_active).sort((a,b)=>a.duration_min-b.duration_min);
    windows.forEach(w=>{
      const [sh,sm]=w[0].split(':').map(Number),[eh,em]=w[1].split(':').map(Number), from=sh*60+sm,to=eh*60+em;
      for(let m=from;m<to;m+=30){
        const hh=String(Math.floor(m/60)).padStart(2,'0'),mm=String(m%60).padStart(2,'0'), at=toUtc(day.key,hh+':'+mm,tz);
        const open=at>=minBookAt&&types.some(ty=>m+ty.duration_min<=to&&!bookings.some(b=>at<Date.parse(b.blocked_until||b.ends_at)&&at+ty.duration_min*60000+ty.buffer_min*60000>Date.parse(b.starts_at)));
        if(open) free.push(fmt24(at));
      }
    });
    h+='<div class="calfree"><b>'+tr('available')+' ('+windows.map(w=>w[0]+'–'+w[1]).join(', ')+')</b><div class="row" style="gap:4px;margin-top:5px">'+(free.length?free.map(x=>'<span class="chip" style="padding:3px 7px;font-size:11px;cursor:default">'+x+'</span>').join(''):'<span>'+tr('noFreeSlots')+'</span>')+'</div></div>';
  } else {
    h+='<div class="calempty">'+tr('unavailable')+'</div>';
  }
  if(bookings.length){
    bookings.forEach(b=>{
      const st=b.session_types||{};
      h+='<div class="calbook"><b>'+fmtTime(b.starts_at)+' · '+esc(b.student_name)+'</b>'
        +'<small>'+(st.duration_min||'')+' '+tr('min')+' · '+esc(tn(st))+(b.series_id?' · '+tr('weeklyBadge'):'')+'</small>'
        +'<div class="row" style="gap:6px;margin-top:6px">'
        +'<button class="chip" style="padding:4px 8px;font-size:12px" onclick="promptResched(\''+b.id+'\',true)">'+tr('resched')+'</button>'
        +'<button class="chip danger" style="padding:4px 8px;font-size:12px" onclick="promptCancel(\''+b.id+'\')">'+tr('removeBooking')+'</button>'
        +'</div></div>';
    });
  } else {
    h+='<div class="calempty">'+tr('noBookingsDay')+'</div>';
  }
  h+='</div>';
  return h;
}

function renderWeekTimetable(days,tz,dayKey,minBookAt){
  const windowsFor=day=>{const ex=S.dExc.filter(x=>x.on_date===day.key);return ex.some(x=>!x.is_available)?[]:ex.length?ex.filter(x=>x.is_available).map(x=>[(x.start_time||'').slice(0,5),(x.end_time||'').slice(0,5)]):S.wk[new Date(day.key+'T12:00:00Z').getUTCDay()]||[]};
  const windows=days.map(windowsFor); const all=windows.flat();
  if(!all.length) return '<div class="calempty">'+tr('unavailable')+'</div>';
  const mins=all.flatMap(w=>w.map(t=>{const [h,m]=t.split(':').map(Number);return h*60+m}));
  const from=Math.floor(Math.min(...mins)/30)*30, to=Math.ceil(Math.max(...mins)/30)*30;
  const times=[]; for(let m=from;m<to;m+=30) times.push(m);
  const timeLabel=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  let h='<div class="timetable-wrap"><div class="timetable"><div class="tt-head tt-time">'+(lang==='ar'?'الوقت':'Time')+'</div>';
  days.forEach(d=>h+='<div class="tt-head">'+d.date.toLocaleDateString(loc(),{timeZone:tz,weekday:'short',day:'numeric',month:'short'})+'</div>');
  times.forEach(m=>{
    h+='<div class="tt-time">'+timeLabel(m)+'</div>';
    days.forEach((day,idx)=>{
      const win=windows[idx].some(w=>{const [a,b]=w.map(t=>{const [hh,mm]=t.split(':').map(Number);return hh*60+mm});return m>=a&&m<b});
      const at=toUtc(day.key,timeLabel(m),tz), bk=S.dBk.find(b=>dayKey(new Date(b.starts_at))===day.key&&at>=Date.parse(b.starts_at)&&at<Date.parse(b.blocked_until||b.ends_at));
      const starts=S.dBk.find(b=>dayKey(new Date(b.starts_at))===day.key&&Math.abs(Date.parse(b.starts_at)-at)<60000);
      if(starts){const st=starts.session_types||{};h+='<div class="tt-cell tt-booked"><b>'+esc(starts.student_name)+'</b><small>'+timeLabel(m)+' · '+(st.duration_min||'')+' '+tr('min')+'</small></div>';}
      else if(bk) h+='<div class="tt-cell tt-occupied"></div>';
      else if(win){const type=S.dTypes.filter(t=>t.is_active&&m+t.duration_min<=to&&at>=minBookAt).sort((a,b)=>a.duration_min-b.duration_min)[0];h+='<div class="tt-cell tt-free">'+(type?'<button title="'+tr('bookForStudent')+'" onclick="startTeacherBookingAt(\''+day.key+'\',\''+timeLabel(m)+'\')">＋</button>':'')+'</div>';}
      else h+='<div class="tt-cell tt-closed"></div>';
    });
  });
  return h+'</div></div><div class="tt-legend"><span>🟩 '+tr('available')+'</span><span>🟪 '+(lang==='ar'?'حصة محجوزة':'Booked lesson')+'</span><span>⬜ '+tr('unavailable')+'</span></div>';
}
async function startTeacherBookingAt(day,time){await startTeacherBooking();const types=S.types.filter(x=>x.is_active).sort((a,b)=>a.duration_min-b.duration_min);if(types[0]){S.ty=types[0];build();S.slot=Object.values(S.slots).flat().find(x=>Math.abs(x-toUtc(day,time,S.t.timezone))<60000)||null;S.day=S.slot?new Date(S.slot).toLocaleDateString('en-CA'):null;}render();}

function teacherCalendar(){
  const tz=S.me.teacher.timezone;
  const dayKey=d=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});return p.year+'-'+p.month+'-'+p.day};
  const fmtTime=iso=>new Date(iso).toLocaleTimeString(loc(),{timeZone:tz,hour:'numeric',minute:'2-digit'});
  const fmt24=ms=>new Date(ms).toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  const minBookAt=Date.now()+(S.me.teacher.on_the_spot_booking?0:8)*3600000;

  const modeBtns = ['day','week','agenda'].map(m=>{
    const label = m==='day'?tr('calViewDay'):m==='week'?tr('calViewWeek'):tr('calViewAgenda');
    return '<button class="chip'+(S.calMode===m?' on':'')+'" onclick="setCalMode(\''+m+'\')">'+label+'</button>';
  }).join('');

  let h='<div class="card"><div class="calnav"><h2>'+tr('calendarTitle')+'</h2><div class="row">'+modeBtns+'<button class="btn" style="width:auto" onclick="startTeacherBooking()">＋ '+tr('bookForStudent')+'</button></div></div>'+flashHtml()+'<p class="mut" style="margin-top:0">'+tr('calendarHint')+' (<b dir="ltr">'+esc(tz)+'</b>)</p>';

  if(S.calMode==='day'){
    const d=new Date(); d.setDate(d.getDate()+S.dayOffset);
    const dayObj={date:d,key:dayKey(d)};
    h+='<div class="calnav">'
      +'<div class="row"><button class="chip" onclick="S.dayOffset--;render()">‹ '+tr('prevDay')+'</button>'
      +'<button class="chip" onclick="S.dayOffset=0;render()">'+tr('todayBtn')+'</button>'
      +'<button class="chip" onclick="S.dayOffset++;render()">'+tr('nextDay')+' ›</button></div>'
      +'<b>'+d.toLocaleDateString(loc(),{timeZone:tz,weekday:'long',month:'short',day:'numeric'})+'</b>'
      +'</div>';
    h+=renderDayCol(dayObj, tz, fmtTime, fmt24, dayKey, minBookAt, true);
  } else if(S.calMode==='week'){
    const base=new Date(); base.setDate(base.getDate()+S.calendarOffset*7);
    const days=[]; for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);days.push({date:d,key:dayKey(d)});}
    h+='<div class="calnav">'
      +'<div class="row"><button class="chip" onclick="S.calendarOffset--;render()">‹ '+tr('previousWeek')+'</button>'
      +'<button class="chip" onclick="S.calendarOffset=0;render()">'+tr('todayBtn')+'</button>'
      +'<button class="chip" onclick="S.calendarOffset++;render()">'+tr('nextWeek')+' ›</button></div>'
      +'<b>'+days[0].date.toLocaleDateString(loc(),{month:'short',day:'numeric'})+' – '+days[6].date.toLocaleDateString(loc(),{month:'short',day:'numeric'})+'</b>'
      +'</div>';
    h+=renderWeekTimetable(days,tz,dayKey,minBookAt);
  } else {
    if(!S.dBk.length){
      h+='<p class="mut">'+tr('noBk')+'</p>';
    } else {
      let lastKey='';
      S.dBk.forEach(b=>{
        const k=dayKey(new Date(b.starts_at)), st=b.session_types||{}, ph=(b.contact_phone||'').replace(/\D/g,'');
        if(k!==lastKey){
          lastKey=k;
          h+='<h3 style="margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--line)">📅 '+fD(k)+'</h3>';
        }
        h+='<div class="bk"><div><b>'+fmtTime(b.starts_at)+' · '+esc(b.student_name)+'</b>'+(b.series_id?'<span class="badge">'+tr('weeklyBadge')+'</span>':'')
          +'<br><span class="mut">'+(st.duration_min||'')+' '+tr('min')+' · '+esc(tn(st))+'</span>'
          +(ph?' · <a target="_blank" rel="noopener" href="https://wa.me/'+ph+'">'+esc(b.contact_phone)+'</a>':'')
          +'</div><div class="row">'
          +'<button class="chip" onclick="promptResched(\''+b.id+'\',true)">'+tr('resched')+'</button>'
          +'<button class="chip danger" onclick="promptCancel(\''+b.id+'\')">'+tr('removeBooking')+'</button>'
          +'</div></div>';
      });
    }
  }
  h+='</div>';
  return h;
}

function tabBookings(){
  return '<div class="card"><h2>'+tr('upcoming')+'</h2>'+flashHtml()+(S.dBk.length?S.dBk.map(b=>{
    const st=b.session_types||{}, ph=(b.contact_phone||'').replace(/\D/g,'');
    return '<div class="bk"><div><b>'+esc(b.student_name)+'</b>'+(b.series_id?'<span class="badge">'+tr('weeklyBadge')+'</span>':'')+'<br><span class="mut">'+fF(Date.parse(b.starts_at))+' · '+(st.duration_min||'')+' '+tr('min')+'</span>'
      +(ph?'<br><a target="_blank" rel="noopener" href="https://wa.me/'+ph+'">'+esc(b.contact_phone)+'</a>':'')+(b.notes?'<br><span class="mut">'+esc(b.notes)+'</span>':'')+'</div>'
      +'<div class="row"><button class="chip" onclick="promptResched(\''+b.id+'\',true)">'+tr('resched')+'</button><button class="chip danger" onclick="promptCancel(\''+b.id+'\')">'+tr('removeBooking')+'</button></div></div>';
  }).join(''):'<p class="mut">'+tr('noBk')+'</p>')+'</div>';
}
function tabProfile(){

    +fld(tr('dname'),'<input id="pn" value="'+esc(t.display_name)+'">')
    +fld(tr('bioL'),'<textarea id="pb">'+esc(t.bio||'')+'</textarea>')
    +fld(tr('photoL'),'<input id="pp" style="direction:ltr" value="'+esc(t.photo_url||'')+'">')
    +fld(tr('meetL'),'<input id="pm" style="direction:ltr" placeholder="https://meet.google.com/…" value="'+esc(t.meeting_url||'')+'"><p class="mut" style="margin:-4px 0 10px">'+tr('meetH')+'</p>')

    +'<label class="ck"><input id="onspot" type="checkbox"'+(t.on_the_spot_booking?' checked':'')+'> '+tr('onSpot')+'</label><p class="mut">'+tr('noticeEight')+'</p>'
    +fld(tr('slugL'),'<input id="ps" style="direction:ltr" value="'+esc(t.slug)+'"><p class="mut" style="margin:-4px 0 10px">'+tr('slugWarn')+'</p>')
    +'<button class="btn" onclick="saveProfile()">'+tr('save')+'</button></div>';
}
function adminDashboard(){
  const d=S.adminData;
  if(S.adminLoading&&!d) return '<div class="card mut">…</div>';
  if(!d||d.error) return '<div class="card"><h2>'+tr('adminStats')+'</h2><p class="err">'+tr('adminLoadError')+'</p><button class="btn" onclick="loadAdminOverview()">'+tr('fix')+'</button></div>';
  const st=d.stats||{};
  let h='<div class="card"><h2>'+tr('adminStats')+'</h2><div class="g3">'+[[tr('totalTeachers'),st.total_teachers],[tr('activeTeachers'),st.active_teachers],[tr('totalBookings'),st.total_bookings],[tr('confirmedBookings'),st.confirmed_bookings],[tr('cancelledBookings'),st.cancelled_bookings],[tr('teacherCreated'),st.teacher_created_bookings]].map(([k,v])=>'<div class="feat"><b>'+esc(k)+'</b><strong style="font-size:25px">'+Number(v||0).toLocaleString()+'</strong></div>').join('')+'</div></div>';
  h+='<div class="card"><h2>'+tr('adminTeachers')+'</h2>';
  const ts=d.teachers||[];
  h+=ts.length?ts.map(t=>'<div class="bk"><div><b>'+esc(t.display_name||'')+'</b> '+(t.is_active?'<span class="badge">Active</span>':'<span class="badge">Inactive</span>')+'<br><span class="mut">'+esc(t.slug||'')+' · '+esc(t.timezone||'')+(t.created_at?' · '+tr('createdAt')+': '+new Date(t.created_at).toLocaleDateString(loc()):'')+'</span></div><div class="row"><a class="chip" target="_blank" rel="noopener" href="'+location.origin+'/?t='+encodeURIComponent(t.slug||'')+'">'+tr('publicPreview')+'</a></div></div>').join(''):'<p class="mut">'+tr('noTeachers')+'</p>';
  return h+'</div>';
}

function viewDash(){
  const tabs=[['link','tLink'],['calendar','calendarTab'],['hours','tHours'],['types','tTypes'],['bk','tBook'],['prof','tProf']];
  if(S.me.role==='admin') tabs.push(['inv','tInv'],['admin','tAdmin']);
  let h='<div class="card"><div class="row">'+tabs.map(([k,l])=>'<button class="chip'+(S.tab===k?' on':'')+'" onclick="setTab(\''+k+'\')">'+tr(l)+'</button>').join('')+'</div></div>';
  h+=({link:tabLink,calendar:teacherCalendar,hours:tabHours,types:tabTypes,bk:tabBookings,prof:tabProfile,inv:()=>flashHtml()+invitesCard(),admin:adminDashboard}[S.tab]||tabLink)();
  return h;
}

function renderModal(){
  const M=$('#modalRoot');
  if(!S.modal){M.innerHTML='';return}
  const b=S.modal.booking;
  if(S.modal.type==='cancel'){
    M.innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'
      +'<h3>'+tr('cancelModalTitle')+'</h3>'
      +'<p class="mut" style="margin:0">'+esc(b.student_name)+' · '+fF(Date.parse(b.starts_at))+'</p>'
      +'<p class="mut" style="margin:6px 0 0">'+tr('cancelModalSub')+'</p>'
      +'<div class="stack">'
      +'<button class="btn g" onclick="executeCancel(\''+b.id+'\',\'single\')">'+tr('cancelOne')+'</button>'
      +'<button class="btn g" onclick="executeCancel(\''+b.id+'\',\'future\')">'+tr('cancelFuture')+'</button>'
      +'<button class="btn d" onclick="executeCancel(\''+b.id+'\',\'all\')">'+tr('cancelAll')+'</button>'
      +'<button class="chip" onclick="closeModal()">'+tr('back')+'</button>'
      +'</div></div></div>';
  } else if(S.modal.type==='resched'){
    const asT = S.modal.asTeacher ? 'true' : 'false';
    M.innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'
      +'<h3>'+tr('reschedModalTitle')+'</h3>'
      +'<p class="mut" style="margin:0">'+esc(b.student_name)+' · '+fF(Date.parse(b.starts_at))+'</p>'
      +'<p class="mut" style="margin:6px 0 0">'+tr('reschedModalSub')+'</p>'
      +'<div class="stack">'
      +'<button class="btn" onclick="startResched(\''+b.id+'\',\'single\','+asT+')">'+tr('reschedOne')+'</button>'
      +'<button class="btn g" onclick="startResched(\''+b.id+'\',\'future\','+asT+')">'+tr('reschedFuture')+'</button>'
      +'<button class="chip" onclick="closeModal()">'+tr('back')+'</button>'
      +'</div></div></div>';
  }
}

// ---- main render ----
function render(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  const A=$('#app');
  $('#who').textContent=S.user?(tr('hi')+' '+(S.user.user_metadata?.full_name||S.user.email)):'';
  let b='<button type="button" id="languageToggle">'+tr('lang')+'</button> ';
  if(S.user&&S.slug) b+='<button onclick="nav(null)">'+tr(S.me&&S.me.teacher?'goDash':'goHome')+'</button> ';
  b+='<button onclick="S.user?signOut():signIn()">'+tr(S.user?'out':'in')+'</button>';
  $('#btns').innerHTML=b;
  const languageToggle=$('#languageToggle'); if(languageToggle) languageToggle.addEventListener('click',()=>setLang(lang==='ar'?'en':'ar'));
  $('#footNote').textContent=tr('footNote');
  $('#footPriv').textContent=tr('footPriv');
  $('#footTerms').textContent=tr('footTerms');

  const dash=!S.slug&&S.user&&S.me&&S.me.teacher&&!S.reg;
  A.className = (dash && S.tab==='calendar' && S.calMode==='week') ? 'wide' : '';
  $('#h1').textContent = S.slug&&S.t ? tr('bookWith')+' '+S.t.display_name : dash ? tr('dashTitle') : tr('title');
  $('#sub').textContent = S.slug ? '' : dash ? S.me.teacher.display_name : tr('sub');
  if(SB_KEY.startsWith('PASTE')){A.innerHTML='<div class="card err">'+tr('cfg')+'</div>';return}
  if(!S.ready){A.innerHTML='<div class="card mut">…</div>';return}
  A.innerHTML = S.slug ? viewBook()
    : !S.user ? viewLanding()
    : !S.me ? '<div class="card mut">…</div>'
    : dash ? viewDash()
    : viewHome();
  renderModal();
}

async function init(){
  const q=new URLSearchParams(location.search), m=location.pathname.match(/^\/t\/([a-z0-9-]+)/i);
  let slug=((q.get('t')||(m&&m[1])||'')+'').toLowerCase()||null;
  const inv=q.get('invite'); if(inv) ls.set('invite',inv.toUpperCase().replace(/[^A-Z0-9]/g,''));
  const {data:{session}}=await sb.auth.getSession(); S.user=session?.user||null;
  const next=ls.get('next'); ls.del('next');
  if(!slug&&S.user&&next) slug=next;
  S.slug=slug;
  writeAppHistory('replace');
  window.addEventListener('popstate', async (event)=>{
    if(event.state?.bmc){ await restoreAppRoute(event.state); }
    else {
      // Keep browser Back inside the app instead of leaving an authenticated page
      // through a stale OAuth redirect/history entry. Never sign the user out here.
      writeAppHistory('replace');
      if(S.user&&S.me?.teacher){S.slug=null;S.teacherBooking=false;S.rs=null;S.rsAsTeacher=false;await loadDash();render();}
    }
  });
  sb.auth.onAuthStateChange((_e,s)=>{
    const u=s?.user||null;
    if((u?.id||null)!==(S.user?.id||null)) setTimeout(async()=>{
      S.user=u; S.loaded=null; S.done=null;
      if(u){await Promise.all([loadMe(),loadMine()])} else {S.me=null;S.mine=[]}
      if(S.slug&&S.t&&u) await loadBook();
      S.reg = !!(u&&S.me&&!S.me.teacher&&hasInvite()&&!S.slug);
      render();
    },0);
  });
  if(S.user) await Promise.all([loadMe(),loadMine()]);
  await loadTeacher();
  if(S.slug&&S.user&&S.t) await loadBook();
  S.reg = !!(S.user&&S.me&&!S.me.teacher&&hasInvite()&&!S.slug);
  S.ready=true; render();
}
render(); init();
</script>
